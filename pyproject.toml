[project]
name = "poetry-guard-plugin"
version = "0.3.0"
description = "Plugin for Poetry that wraps dependency installs/updates with a validation process to check for potential supply chain attacks"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Fritz Heckel", email = "fwph@fwph.net" }]
dependencies = [
    "regex",
    "poetry (>=2.0,<3)",
    "guarddog (>=3.0,<4.0)",
    "aiohttp",
]

[project.urls]
Homepage = "https://github.com/fwph/poetry-guard-plugin"
Repository = "https://github.com/fwph/poetry-guard-plugin"

[project.entry-points."poetry.application.plugin"]
poetry-guard = "poetry_guard_plugin.plugin:GuardApplicationPlugin"

[project.entry-points."poetry_guard.validators.lockfile"]
osv = "poetry_guard_plugin.validators.osv:OsvValidator"
metadata = "poetry_guard_plugin.validators.metadata:MetadataValidator"

[project.entry-points."poetry_guard.validators.artifact"]
guarddog = "poetry_guard_plugin.validators.guarddog:GuardDogValidator"

[tool.poetry]
packages = [{ include = "poetry_guard_plugin" }]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"

[tool.poetry.group.dev.dependencies]
pytest = "*"
pytest-cov = "*"
pytest-asyncio = "*"
flake8 = "*"
mypy = "*"
black = "*"
bandit = { extras = ["toml"], version = "*" }
coverage = { extras = ["toml"], version = "*" }

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
explicit_package_bases = true
mypy_path = "."

[tool.pytest.ini_options]
testpaths = ["test"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["poetry_guard_plugin"]
omit = ["test/*"]

[tool.coverage.report]
show_missing = true
